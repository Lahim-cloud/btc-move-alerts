name: BTC move alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: btc-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check BTC vs last alert price + EMA breaks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ inputs.test }}
        run: node check.mjs
      - name: Persist state (baseline, anchor or signals)
        run: |
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git config user.name "btc-alerts-bot"
              git config user.email "btc-alerts-bot@users.noreply.github.com"
              git commit -m "state $(date -u +%FT%TZ)"
              git push
            fi
          fi
      - name: Daily heartbeat (keeps the schedule enabled)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            date -u +%FT%TZ > heartbeat.txt
            git config user.name "btc-alerts-bot"
            git config user.email "btc-alerts-bot@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "heartbeat $(date -u +%F)" || true
            git push || true
          fi
