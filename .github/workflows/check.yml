name: BTC move alerts

on:
  schedule:
    - cron: "21,51 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message instead of checking"
        type: boolean
        default: false
      sleep_seconds:
        description: "Seconds to wait before scheduling the next run (testing only; leave default in normal use)"
        default: "600"

permissions:
  contents: write
  actions: write

concurrency:
  group: btc-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check BTC vs last alert price + EMA breaks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ inputs.test }}
        run: node check.mjs
      - name: Persist state (baseline, anchor or signals)
        run: |
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git config user.name "btc-alerts-bot"
              git config user.email "btc-alerts-bot@users.noreply.github.com"
              git commit -m "state $(date -u +%FT%TZ)"
              git push || true
            fi
          fi
      - name: Daily heartbeat (keeps the schedule enabled)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            date -u +%FT%TZ > heartbeat.txt
            git config user.name "btc-alerts-bot"
            git config user.email "btc-alerts-bot@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "heartbeat $(date -u +%F)" || true
            git push || true
          fi
      - name: Wait, then schedule the next run (self-chaining)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: |
          sleep "${SLEEP_SECONDS:-600}"
          me="${{ github.run_id }}"
          repo="${{ github.repository }}"
          others=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/actions/runs?per_page=30" | jq --argjson me "$me" '[.workflow_runs[] | select(.name == "BTC move alerts") | select(.status != "completed") | select(.id != $me)] | length')
          if [ "$others" -gt 0 ] 2>/dev/null; then
            echo "another run is already pending ($others); not scheduling a new one"
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/actions/workflows/check.yml/dispatches" -d '{"ref":"main"}')
            echo "schedule-next attempt $i -> $code"
            if [ "$code" = "204" ]; then break; fi
            sleep 10
          done
